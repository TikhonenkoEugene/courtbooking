# Один брокер в режиме KRaft
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      # Образ превращает все KAFKA_* в настройки брокера, включая KAFKA_PORT из Service
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:4.0.0
          env:
            - { name: KAFKA_NODE_ID, value: '1' }
            - { name: KAFKA_PROCESS_ROLES, value: 'broker,controller' }
            - { name: KAFKA_LISTENERS, value: 'PLAINTEXT://:19092,CONTROLLER://:9093' }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: 'PLAINTEXT://kafka:19092' }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT' }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            # через localhost: адрес Service появится только после readiness, которой нужен контроллер
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: '1@localhost:9093' }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: '1' }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: '1' }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: '1' }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: '0' }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
            - { name: KAFKA_HEAP_OPTS, value: '-Xms256m -Xmx512m' }
          ports:
            - { name: kafka, containerPort: 19092 }
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector: { app: kafka }
  ports:
    - { name: kafka, port: 19092, targetPort: kafka }
