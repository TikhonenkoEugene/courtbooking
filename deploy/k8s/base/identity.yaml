apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
spec:
  selector:
    matchLabels: { app: identity }
  template:
    metadata:
      labels: { app: identity }
    spec:
      enableServiceLinks: false
      containers:
        - name: identity
          image: courtbook/identity:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8081 }
          envFrom:
            - configMapRef: { name: courtbook-common }
          env:
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: pg-identity, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pg-identity, key: password } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: jwt-secret, key: secret } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: identity
spec:
  selector: { app: identity }
  ports:
    - { name: http, port: 8081, targetPort: http }
