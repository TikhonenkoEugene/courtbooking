apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
spec:
  selector:
    matchLabels: { app: payment }
  template:
    metadata:
      labels: { app: payment }
    spec:
      enableServiceLinks: false
      containers:
        - name: payment
          image: courtbook/payment:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8084 }
          envFrom:
            - configMapRef: { name: courtbook-common }
          env:
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: pg-payment, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pg-payment, key: password } }
          readinessProbe:
            httpGet: { path: /actuator/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: payment
spec:
  selector: { app: payment }
  ports:
    - { name: http, port: 8084, targetPort: http }
