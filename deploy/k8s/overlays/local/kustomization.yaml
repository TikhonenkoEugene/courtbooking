apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# пользователь courtbook для DBeaver: доступ ко всем базам сервисов
patches:
  - target: { kind: Cluster, name: courtbook-pg }
    patch: |-
      - op: add
        path: /spec/managed/roles/-
        value:
          name: courtbook
          ensure: present
          login: true
          inRoles: [identity, catalog, booking, payment, notification]
          passwordSecret: { name: pg-courtbook }
